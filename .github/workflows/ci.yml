name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Escaneo de secretos (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Instalar gitleaks 8.30.1 (SHA-256 verificado)
        run: |
          curl -fsSL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks
      - name: Escanear historial completo
        run: ./gitleaks git . -c .gitleaks.toml --redact --verbose --exit-code 1

  python:
    name: Python (lint, tipos, pruebas y cobertura)
    runs-on: ubuntu-24.04
    needs: secrets
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.8"
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run ruff check src tests migrations
      - run: uv run ruff format --check src tests migrations
      - run: uv run mypy
      - name: Pruebas (T-01 a T-12 sobre datos ficticios) con cobertura
        run: uv run pytest --cov --cov-report=term-missing

  web:
    name: Frontend (tipos, pruebas y build)
    runs-on: ubuntu-24.04
    needs: secrets
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24.22.3"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: Reconstrucción desde la muestra (T-12) y E2E
    runs-on: ubuntu-24.04
    needs: [python, web]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.8"
          python-version: "3.13"
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24.22.3"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen --no-dev
      - name: Reconstruir dataset, modelos, informe y base desde cero
        env:
          CPCMINI_DATABASE_URL: sqlite:///build/cpcmini.db
        run: |
          mkdir -p build
          uv run cpcmini rebuild --override configs/sample.yaml --models tfidf_knn,tfidf_logreg --reports build/sample/reports
      - name: Levantar la API
        env:
          CPCMINI_DATABASE_URL: sqlite:///build/cpcmini.db
          CPCMINI_MODEL_DIR: build/sample/artifacts/serving
          CPCMINI_CORS_ALLOWED_ORIGINS: http://127.0.0.1:4173
          CPCMINI_RATE_LIMIT_PER_MINUTE: "600"
        run: |
          nohup uv run uvicorn cpcmini.serve.api:create_app --factory --host 127.0.0.1 --port 8000 --no-access-log > api.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/api/v1/health && break; sleep 2; done
      - name: Playwright
        working-directory: frontend
        env:
          CI: "true"
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  docker:
    name: Imágenes Docker
    runs-on: ubuntu-24.04
    needs: [python, web]
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker build -t cpc-mini-api:ci .
      - run: docker build -t cpc-mini-web:ci frontend
